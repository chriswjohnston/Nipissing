name: Backfill archive from cache
on:
  workflow_dispatch:        # manual one-click run only
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run backfill
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/backfill_from_cache.py
      - name: Commit archived documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/files data/canonical
          git diff --cached --quiet || git commit -m "Backfill archive from cached PDFs"
          git pull --rebase origin main
          git push
