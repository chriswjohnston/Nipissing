name: Inventory by-laws
# One-click survey of every by-law PDF on the township website, compared with
# the archive. Writes data/runtime/bylaw_inventory.json; changes no records.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-records
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4
      - name: Survey the township website
        run: python scripts/inventory_bylaws.py
      - name: Commit the inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/bylaw_inventory.json
          git diff --cached --quiet || git commit -m "By-law inventory of the township website"
          git pull --rebase origin main
          git push
