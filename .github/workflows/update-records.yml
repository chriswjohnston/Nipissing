name: Update records
on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"
permissions:
  contents: write
# Never run two updates at once: both would change the same data files and
# the second one's save fails (seen 2026-10-21). A queued run waits its turn.
concurrency:
  group: update-records
  cancel-in-progress: false
jobs:
  update-records:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pdfminer.six pymupdf
          # OCR for scanned agenda packages (by-law extraction)
          sudo apt-get install -y -qq tesseract-ocr >/dev/null
      - name: Run record updaters
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        # Each updater runs on its own: if one source is down (e.g. the
        # township site), the others still update and their data is saved.
        # Failures are listed and fail the run at the very end, after commit.
        # validate_data.py is the exception: if it fails, nothing is committed.
        run: |
          failed=""
          # Township site check, once: if it's down (2026-10-21 hosting outage),
          # its updaters would each wait out long timeouts, so skip them.
          township_up=1
          if ! curl -sS -o /dev/null --max-time 25 -A "Mozilla/5.0" \
               -w "township site: HTTP %{http_code} in %{time_total}s\n" \
               --fail https://nipissingtownship.com/council/council-meeting-dates-agendas-minutes/; then
            township_up=0
            echo "::warning title=Township website unreachable::Skipping update_meetings, update_bylaws, update_adjustment and update_boards this run; stored data kept. They resume automatically when the site is back."
          fi
          for s in update_meetings import_documents financials recover_documents generate_summaries update_bylaws package_index consolidate_bylaws \
                   update_adjustment update_boards update_library update_healthunit \
                   update_dnssab attach_videos doc_tidy archive_plans check_freshness audit_site build_sitemap; do
            case "$s" in
              update_meetings|financials|update_bylaws|update_adjustment|update_boards)
                if [ "$township_up" = 0 ]; then echo "skipped $s (township site down)"; continue; fi ;;
            esac
            echo "::group::$s"
            # 30-minute ceiling per updater so one hanging source can't stall the run.
            if ! timeout 30m python "scripts/$s.py"; then
              echo "::warning title=$s failed::$s.py exited with an error or ran over 30 minutes; its stored data was kept. See its section of this log."
              failed="$failed $s"
            fi
            echo "::endgroup::"
          done
          echo "FAILED_UPDATERS=${failed# }" >> "$GITHUB_ENV"
          python scripts/validate_data.py
      - name: Show canonical data counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path("data/canonical")
          meetings = json.loads((base / "meetings.json").read_text(encoding="utf-8"))
          bylaws = json.loads((base / "bylaws.json").read_text(encoding="utf-8"))
          resolutions = json.loads((base / "resolutions.json").read_text(encoding="utf-8"))
          boards = json.loads((base / "boards.json").read_text(encoding="utf-8"))
          print("meetings:", len(meetings.get("meetings", [])))
          print("bylaws:", len(bylaws.get("bylaws", [])))
          print("resolutions:", len(resolutions.get("resolutions", [])))
          print("board meetings:", sum(len(b.get("meetings", [])) for b in boards.get("boards", [])))
          PY
      - name: Commit canonical data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only paths that exist: a missing one (data/financial before the
          # first FIR download) makes git add fail and loses the whole run.
          for p in data/canonical data/runtime data/financial data/packages docs/files inbox sitemap.xml robots.txt; do
            [ -e "$p" ] && git add -A -- "$p"
          done
          git diff --cached --quiet || git commit -m "Auto-update canonical records"
          # If main changed meanwhile (a merged PR), keep both; where the same
          # lines changed, this run's fresh data wins.
          git pull --rebase -X theirs origin main
          git push
      - name: Report failed updaters
        if: env.FAILED_UPDATERS != ''
        run: |
          echo "::error::These updaters failed (other data was still saved): $FAILED_UPDATERS"
          exit 1
